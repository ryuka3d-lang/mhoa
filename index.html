    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #000000;
            --primary-dark: #1a1a1a;
            --primary-light: #404040;
            --background: #ffffff;
            --surface: #f8f8f8;
            --surface-alt: #ffffff;
            --text: #111111;
            --text-muted: #666666;
            --border: #e5e5e5;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode {
            --primary: #ffffff;
            --primary-dark: #e5e5e5;
            --primary-light: #a3a3a3;
            --background: #0a0a0a;
            --surface: #171717;
            --surface-alt: #0a0a0a;
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --border: #262626;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--background); color: var(--text); line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 600; letter-spacing: -0.02em; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        img { max-width: 100%; display: block; }
        button { font-family: 'Montserrat', sans-serif; cursor: pointer; }

        /* HEADER */
        header { background: var(--background); padding: 1rem 5%; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); background-color: rgba(255,255,255,0.95); }
        body.dark-mode header { background-color: rgba(10,10,10,0.95); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
        
        .logo-container { display: flex; align-items: center; }
        .logo-img { height: 50px; width: auto; transition: var(--transition); }
        .logo-img:hover { transform: scale(1.05); opacity: 0.8; }
        
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; position: relative; }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--primary); transition: var(--transition); }
        .nav-links a:hover::after { width: 100%; }
        
        .controls { display: flex; gap: 12px; align-items: center; }
        .control-btn, .cart-btn { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 4px; font-weight: 600; color: var(--text); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
        .control-btn:hover, .cart-btn:hover { border-color: var(--primary); background: var(--primary); color: var(--background); }
        .cart-count { background: var(--primary); color: var(--background); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
        body.dark-mode .cart-count { background: var(--background); color: var(--primary); }

        /* HERO */
        .hero { background: var(--background); color: var(--text); text-align: center; padding: 8rem 1rem 6rem; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, var(--surface) 0%, transparent 70%); z-index: 0; }
        .hero-content { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1.5rem; line-height: 1.1; font-weight: 400; }
        .hero h1 em { font-style: italic; font-weight: 600; }
        .hero p { font-size: 1.1rem; max-width: 600px; margin: 0 auto 2.5rem; color: var(--text-muted); font-weight: 400; }
        .hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-primary { background: var(--primary); color: var(--background); padding: 14px 36px; border-radius: 2px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--primary); }
        .btn-primary:hover { background: transparent; color: var(--primary); }
        .btn-secondary { background: transparent; color: var(--text); padding: 14px 36px; border-radius: 2px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); }

        /* ========================================= */
        /* SEPARADOR DE MARCA - TRAMA CON BLUR */
        /* ========================================= */
        .brand-divider { 
            position: relative; 
            padding: 6rem 5%; 
            overflow: hidden;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .brand-divider-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('trama-clara.png');
            background-repeat: repeat;
            background-size: 100px; /* Más chico = más denso el patrón */
            filter: blur(0px); /* SIN blur para que se vea nítida */
            opacity: 0.15; /* Opacidad más alta para que se note */
            z-index: 0;
        }

        body.dark-mode .brand-divider-bg {
            background-image: url('trama-oscura.png');
            opacity: 0.12;
        }

        .brand-divider-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85); /* Más opaco para que el texto se lea bien */
            z-index: 1;
        }

        body.dark-mode .brand-divider-overlay {
            background: rgba(10, 10, 10, 0.85);
        }

        .brand-divider-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 4rem;
            align-items: center;
        }

        .divider-image {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .divider-image img {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .divider-text {
            text-align: left;
        }

        .sub-brand-badge { 
            display: inline-block; 
            padding: 6px 16px; 
            border: 1px solid var(--primary); 
            border-radius: 20px; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
            margin-bottom: 1.5rem; 
            font-weight: 700; 
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
        }

        body.dark-mode .sub-brand-badge {
            background: rgba(0,0,0,0.7);
        }

        .brand-divider h2 { 
            font-size: 2.5rem; 
            margin-bottom: 1.2rem; 
            line-height: 1.2;
            color: var(--text);
        }

        .brand-divider p { 
            color: var(--text-muted); 
            font-size: 1.05rem;
            line-height: 1.8;
            font-weight: 400; 
        }

        @media (max-width: 768px) {
            .brand-divider { padding: 4rem 1.5rem; }
            .brand-divider-content { 
                grid-template-columns: 1fr; 
                gap: 2rem;
                text-align: center;
            }
            .divider-text { text-align: center; }
            .divider-image img { width: 160px; }
            .brand-divider h2 { font-size: 1.8rem; }
        }

        /* FILTROS */
        .filters-section { background: var(--background); padding: 2rem 1rem; position: sticky; top: 73px; z-index: 50; border-bottom: 1px solid var(--border); }
        .filters { text-align: center; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .filter-btn { background: transparent; border: 1px solid var(--border); padding: 10px 24px; border-radius: 2px; cursor: pointer; font-weight: 600; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; transition: var(--transition); }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: var(--background); border-color: var(--primary); }

        /* CATÁLOGO */
        .catalog-section { padding: 4rem 1rem 6rem; max-width: 1400px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-header h2 { font-size: 2.5rem; margin-bottom: 1rem; }
        .section-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; font-weight: 400; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem; }
        
        .product-card { background: var(--surface-alt); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; transition: var(--transition); cursor: pointer; }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        .product-card.professional { border-radius: 0; }
        .product-card.professional .product-img-container { height: 320px; }
        
        .product-img-container { position: relative; overflow: hidden; height: 380px; background: var(--surface); }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .product-card:hover .product-img { transform: scale(1.03); }
        
        .product-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .product-category { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.15em; margin-bottom: 0.75rem; }
        .product-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text); line-height: 1.3; }
        .product-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem; flex-grow: 1; line-height: 1.6; font-weight: 400; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); }
        .product-price { font-size: 1rem; font-weight: 700; color: var(--primary); }
        .view-btn { background: transparent; color: var(--text); padding: 8px 20px; border-radius: 2px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--border); transition: var(--transition); }
        .view-btn:hover { background: var(--primary); color: var(--background); border-color: var(--primary); }
        .add-cart-btn { background: var(--primary); color: var(--background); padding: 8px 20px; border-radius: 2px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--primary); margin-left: 8px; }
        .add-cart-btn:hover { background: transparent; color: var(--primary); }
        .add-cart-btn.added { background: var(--text-muted); border-color: var(--text-muted); color: var(--background); }

        /* VISTA DE PRODUCTO */
        .product-view { display: none; padding: 2rem 1rem 6rem; max-width: 1200px; margin: 0 auto; }
        .product-view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .back-btn { background: transparent; border: 1px solid var(--border); padding: 10px 24px; border-radius: 2px; cursor: pointer; font-weight: 600; color: var(--text); margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
        .back-btn:hover { border-color: var(--primary); }
        .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; background: var(--surface-alt); padding: 2rem; border: 1px solid var(--border); }
        .
